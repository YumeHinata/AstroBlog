	<script type="text/javascript" src="./少女前线-战术棋v0.1.2 beta_files/UnityObject2.js"></script>
	<script type="text/javascript">
		var config = {
			width: 1024,
			height: 576,
			params: { enableDebugging: "0" }

		};
		var u = new UnityObject2(config);

		jQuery(function () {

			var $missingScreen = jQuery("#unityPlayer").find(".missing");
			var $brokenScreen = jQuery("#unityPlayer").find(".broken");
			$missingScreen.hide();
			$brokenScreen.hide();

			u.observeProgress(function (progress) {
				switch (progress.pluginStatus) {
					case "broken":
						$brokenScreen.find("a").click(function (e) {
							e.stopPropagation();
							e.preventDefault();
							u.installPlugin();
							return false;
						});
						$brokenScreen.show();
						break;
					case "missing":
						$missingScreen.find("a").click(function (e) {
							e.stopPropagation();
							e.preventDefault();
							u.installPlugin();
							return false;
						});
						$missingScreen.show();
						break;
					case "installed":
						$missingScreen.remove();
						break;
					case "first":
						break;
				}
			});
			u.initPlugin(jQuery("#unityPlayer")[0], "https://www.yumehinata.com/chess/chess-v0.1.2.unity3d");
		});
	</script>
